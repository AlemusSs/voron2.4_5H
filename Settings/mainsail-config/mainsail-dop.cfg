# Название файла mainsail-dop.cfg

[gcode_macro TOOL_HEAD_0]
description: Status and actions for Tool 0 (Голова 1)
variable_tool_0_status: "N/A"
gcode:
    {% set extruder_key = "extruder" %}
    {% set heater_fan_key = "heater_fan Обдув_радиатора_1" %}
    {% set fan_key = "fan_generic fan_1" %}
    {% set filament_key = "filament_switch_sensor filament_Т0" %}
    {% set tool_key = "tool T0" %}
    {% set status = printer[extruder_key] if extruder_key in printer else none %}
    {% set heater_fan = printer[heater_fan_key] if heater_fan_key in printer else none %}
    {% set fan = printer[fan_key] if fan_key in printer else none %}
    {% set filament = printer[filament_key].filament_detected if filament_key in printer else false %}
    {% set tool = printer[tool_key] if tool_key in printer else none %}
    RESPOND TYPE=echo MSG="Checking objects: Extruder={status is not none}, HeaterFan={heater_fan is not none}, PartFan={fan is not none}, Filament={filament is not none}, Tool={tool is not none}"
    {% if status %}
        {% set heater_fan_status = (heater_fan.speed * 100)|round(0) if heater_fan else "N/A" %}
        {% set fan_status = (fan.speed * 100)|round(0) if fan else "N/A" %}
        {% set offsets = "X: " ~ (tool.gcode_x_offset|float|round(2) if tool else 0) ~ ", Y: " ~ (tool.gcode_y_offset|float|round(2) if tool else 0) ~ ", Z: " ~ (tool.gcode_z_offset|float|round(2) if tool else 0) %}
        RESPOND TYPE=echo MSG="Debug: temperature={status.temperature}, heater_fan_status={heater_fan_status}, fan_status={fan_status}, filament={filament}, offsets={offsets}, active={printer.toolhead.extruder == extruder_key}"
        {% set status_string = "Temp: " ~ status.temperature|float|round(1) ~ "°C, Hotend Fan: " ~ heater_fan_status ~ "%, Part Fan: " ~ fan_status ~ "%, Filament: " ~ filament ~ ", Offsets: " ~ offsets ~ ", Active: " ~ (printer.toolhead.extruder == extruder_key) %}
        SET_GCODE_VARIABLE MACRO=TOOL_HEAD_0 VARIABLE=tool_0_status VALUE="'{status_string}'"
        RESPOND TYPE=echo MSG="Tool 0 Status: {status_string}"
    {% else %}
        SET_GCODE_VARIABLE MACRO=TOOL_HEAD_0 VARIABLE=tool_0_status VALUE="'N/A'"
        RESPOND TYPE=echo MSG="Tool 0 Status: N/A"
    {% endif %}

[gcode_macro INIT_TOOL_HEADS]
description: Initialize tool head status
gcode:
    RESPOND TYPE=echo MSG="Initializing tool heads..."
    TOOL_HEAD_0
    TOOL_HEAD_1
    TOOL_HEAD_2
    TOOL_HEAD_3
    TOOL_HEAD_4
    RESPOND TYPE=echo MSG="Tool heads initialized"

[gcode_macro tool_head_0_group]
description: Голова 1
variable_tool_0_status: "N/A"
gcode:
    TOOL_HEAD_0

[gcode_macro tool_head_1_group]
description: Голова 2
variable_tool_1_status: "N/A"
gcode:
    TOOL_HEAD_1

[gcode_macro tool_head_2_group]
description: Голова 3
variable_tool_2_status: "N/A"
gcode:
    TOOL_HEAD_2

[gcode_macro tool_head_3_group]
description: Голова 4
variable_tool_3_status: "N/A"
gcode:
    TOOL_HEAD_3

[gcode_macro tool_head_4_group]
description: Голова 5
variable_tool_4_status: "N/A"
gcode:
    TOOL_HEAD_4