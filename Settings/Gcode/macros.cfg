[gcode_macro _PARK_ON_COOLING_PAD]
gcode:
  G90 ; Absolute positioning
  G0 X118 Y-4.5 Z5 F5000
  G0 Z0 F600

[gcode_macro _CLEAN_NOZZLE]
description: Clean nozzle on nozzle cleaning pad.
gcode:
  G90
  RESPOND TYPE=echo MSG="Cleaning nozzle"
  {% set heater =  printer.toolhead.extruder %}
  M104 S{params.TEMP}
  
  G0 X160 Y100 F5000
  G0 X160 Y-4.5 Z5 F5000
  TEMPERATURE_WAIT SENSOR={heater} MINIMUM={params.TEMP}
  M104 S0 # Set temp to 0
  G0 Z0.5
  G0 X120 F5000
  G0 X155 F5000
  G0 X124 F5000
  G0 X121 F5000
  G0 X118 Z1 F5000
  G0 Z0 F600
  TEMPERATURE_WAIT SENSOR={heater} MAXIMUM=120
  G0 Z20
  G0 Y20

[gcode_macro _WIPE_NOZZLE]
description: Wipe the nozzle on the pad
gcode:
  G90     
  G0 X160 Y-4.5 Z5 F5000
  G0 Z0.5
  G0 X120 F5000
  G0 X155 F5000
  G0 X124 F5000
  G0 X121 F5000
  G0 X118 Z1 F5000
  G0 Z-0.3 F60
  G0 Z5 F600


[gcode_macro UNSAFE_LOWER_BED]
description: Lower the bed 100mm without homing
gcode:
  G90
  SET_KINEMATIC_POSITION Z=100
  G0 Z0 F600
  M84

[gcode_macro UNSAFE_RAISE_BED]
description: Raise the bed 100mm without homing
gcode:
  G90
  SET_KINEMATIC_POSITION Z=0
  G0 Z100 F600
  M84

[gcode_macro _TAP_PROBE_ACTIVATE]
description: Ensure safe temp for bed probing
gcode:
    {% set max_temp = 150 %}
    {% set actual_temp = printer[params.HEATER].temperature %}
    {% set target_temp = printer[params.HEATER].target %}
    {% if target_temp > max_temp %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (target_temp, max_temp)) }
        SET_HEATER_TEMPERATURE HEATER={params.HEATER} TARGET={ max_temp|int - 5 }
    {% endif %}
    # Temperature target is already low enough, but nozzle may still be too hot.
    {% if actual_temp > max_temp  + 2 %}
        { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (actual_temp, max_temp)) }
        TEMPERATURE_WAIT SENSOR={params.HEATER} MAXIMUM={ max_temp }
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]                                          # Выгрузка пластика из текущей головы
description: Выгрузка пластика из текущей головы
variable_ignore_min_extrude_temp: True                                 # Игнорировать минимальную температуру экструзии для этого макроса
gcode:
  M117 Загрузка
  M104 S240                                                            # Установить температуру экструдера на 240°C (начать нагрев)
  TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM=240      # Ждать, пока экструдер нагреется до минимум 240°C
  M83                                                                  # Переключить экструдер в относительный режим (движения E относительно текущей позиции)
  G1 E5 F500                                                           # Экструдировать 5 мм филамента на скорости 500 мм/мин (для выталкивания остатков)
  G1 E-50 F1000                                                        # Ретрагировать (оттянуть) филамент на 50 мм на скорости 1000 мм/мин
  G1 E-50 F1000                                                        # Ретрагировать ещё 50 мм на той же скорости (общая ретракция 100 мм для полной выгрузки)
  M82                                                                  # Переключить экструдер в абсолютный режим (движения E от нуля)
  M400                                                                 # Ждать, пока буфер команд опустеет (завершить все движения)
  M104 S0                                                              # Установить температуру экструдера на 240°C (начать нагрев)
#  TURN_OFF_HEATERS                                                     # Выключить все нагреватели (экструдер и платформу)
  M117 Выгрузка завершена


[gcode_macro UNLOAD_ONE_FILAMENT]                                        # Выгрузка пластика из конкретной головы
description: Выгрузка пластика из конкретной головы
gcode:
  M117 Unloading {params.TOOL}
  M109 T{params.TOOL} S240                                               # Ждать, пока выбранный инструмент (T[TOOL]) нагреется до 240°C
  {% set tool_name = printer.toolchanger.tool_names[params.TOOL|int] %}  # Получить имя инструмента по его номеру (Jinja2 переменная)
  {% set extruder = printer[tool_name].extruder %}                       # Получить объект экструдера для этого инструмента (Jinja2 переменная)
  M104 T{params.TOOL} S240                                               # Установить температуру выбранного инструмента на 240°C (начать нагрев)
  TEMPERATURE_WAIT SENSOR={extruder} MINIMUM=240                         # Ждать нагрева конкретного экструдера до 240°C
  ACTIVATE_EXTRUDER EXTRUDER={extruder}                                  # Активировать выбранный экструдер (подключить его к хотэнду)
  M83                                                                    # Переключить экструдер в относительный режим
  G1 E5 F500                                                             # Экструдировать 5 мм на 500 мм/мин (очистка)
  G1 E-50 F1000                                                          # Ретрагировать 50 мм на 1000 мм/мин
  G1 E-50 F1000                                                          # Ретрагировать ещё 50 мм
  M82                                                                    # Переключить экструдер в абсолютный режим
  M400                                                                   # Ждать завершения буфера команд
  TURN_OFF_HEATERS                                                       # Выключить все нагреватели
  M117 Выгрузка завершена

[gcode_macro UNLOAD_ALL_FILAMENT]                                        # Выгрузка пластика из всех голов
description: Выгрузка пластика из всех голов
gcode:
  {% set tools = printer.toolchanger.tool_names %}                       # Получить список всех имён инструментов (Jinja2 переменная)
  M117 Загрузка
  {% for tool in tools %}                                                # Цикл: для каждого инструмента
    M104 T{printer[tool].tool_number} S240                               # Установить нагрев на 240°C для этого инструмента (параллельный нагрев всех)
  {% endfor %}
  {% for tool in tools %}                                                # Цикл: для каждого инструмента (последовательно)
    M109 T{printer[tool].tool_number} S240                               # Ждать нагрева этого инструмента до 240°C
    ACTIVATE_EXTRUDER EXTRUDER={printer[tool].extruder}                  # Активировать экструдер этого инструмента
    M83                                                                  # Переключить в относительный режим
    G1 E5 F500                                                           # Экструдировать 5 мм
    G1 E-50 F1000                                                        # Ретрагировать 50 мм
    G1 E-50 F1000                                                        # Ретрагировать ещё 50 мм
  {% endfor %}
  M400                                                                   # Ждать завершения всех движений (после цикла)
  M82                                                                    # Переключить экструдер в абсолютный режим
  TURN_OFF_HEATERS                                                       # Выключить нагреватели
  M117 Выгрузка завершена

[gcode_macro CHANGE_NOZZLE]                                              # Замена сопла
description: 
gcode:
  M117 Замена сопла
  M104 S240                                                              # Установить температуру экструдера на 240°C
  G90                                                                    # Переключить в абсолютный режим позиционирования (X/Y/Z)
  G1 X175 Y0 Z100 F1800                                                  # Переместить головку в позицию X=175, Y=0, Z=100 на скорости 1800 мм/мин (удобное место для смены сопла, спереди)
  M109 S240                                                              # Ждать нагрева экструдера до 240°C
  M83                                                                    # Переключить экструдер в относительный режим
  G1 E5 F250                                                             # Экструдировать 5 мм на 250 мм/мин (медленнее, для точной очистки)
  G1 E-50 F1000                                                          # Ретрагировать 50 мм на 1000 мм/мин (частично, чтобы филамент не капал)
  M82                                                                    # Переключить экструдер в абсолютный режим
  M117 Готово к смене сопла

[gcode_macro bed_mesh_test]                                              # Снятие карты стола
description: Снятие карты стола
gcode:
 SET_DISPLAY_TEXT MSG="Старт предподготовки для снятия карты стола"         # Отобразить статус на экране
 M117 Старт предподготовки для снятия карты стола
 SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=False         # Сбросить переменную printing в False
 INITIALIZE_TOOLCHANGER                                                     # Инициализировать toolchanger
 SET_DISPLAY_TEXT MSG="Домашняя позиция"                                    # Отобразить статус на экране
 M117 Домашняя позиция
 G28                                                                        # Домашняя позиция всех осей
 G1 X100 Y350 F20000                                                        # Почти место преднагрева
 G1 X100 Y355 F20000                                                        # Место преднагрева
 SET_DISPLAY_TEXT MSG="Первичный преднагрев экструдера"                     # Отобразить статус на экране
 M117 Первичный преднагрев экструдера
 M109 S150                                                                  # Нагреть активный экструдер до 150°C (смягчить остатки филамента для калибровки)
  {% for wipe in range(3) %}                                                # Чистка сопла
    G1 X110 Y355 F20000
    G1 X135 Y355 F20000
    G1 X135 Y353 F20000
    G1 X110 Y353 F20000
  {% endfor %}
 G1 X150 Y355 F20000                                                        # Место после чистки сопла
 SET_DISPLAY_TEXT MSG="Выравнивание портала"                                # Отобразить статус на экране
 M117 Выравнивание портала
 QUAD_GANTRY_LEVEL                                                          # Выравнивание портала
# BED_MESH_CALIBRATE
 M109 S0                                                                    # Остановить нагрев экструдера (0°C, так как может быть другой хотэнд)
 G1 X100 Y350 F20000                                                        # Почти место преднагрева
 G1 X100 Y355 F20000                                                        # Место преднагрева

