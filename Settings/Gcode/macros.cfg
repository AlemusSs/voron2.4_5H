gcode:
  G90
  G1 X1 F20000
  G1 X1 Y25 F25000
  G1 X8 Y25 F25000
  G1 X8 Y1 Z0.2 F10000
  G1 E10 F1000
  G1 X8 Y1 Z0.2 F10000
  G1 X60 Y1 Z0.2 E18 F1000
  G1 X60 Y1.3 Z0.2 F2000
  G1 X8 Y1.3 Z0.2 E18 F1000