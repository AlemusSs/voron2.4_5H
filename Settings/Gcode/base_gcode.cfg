####################################################################################
# Дополнительные G-code
####################################################################################

[gcode_macro Lig_ON]                    # Макрос на включение подсветки
gcode:
  SET_PIN PIN=Подсветка_корпуса VALUE=1.00

[gcode_macro Lig_OFF]                   # Макрос на выключение подсветки
gcode:
  SET_PIN PIN=Подсветка_корпуса VALUE=0.00

[gcode_macro G32]
gcode:
  BED_MESH_CLEAR                       # Очистить данные о сетке кровати
  G28                                  # Домашняя позиция всех осей
  QUAD_GANTRY_LEVEL                    # Выполните выравнивание портала
  G28                                  # Домашняя позиция всех осей
  G0 X175 Y175 Z30 F3600               # Переместите в нужное положение (для моделей 300 мм или 350 мм)

[gcode_macro Stting_up_the_bed]           # Ручная настройка уровня стола
gcode:
  SET_LED LED="Led_индикация" RED=0.3804 GREEN=0.2588 BLUE=0 SYNC=0 TRANSMIT=1  # Включить жёлтое свечение в серсисе
  G28
  G1 Z1 F1500
  CARTOGRAPHER_TOUCH METHOD=manual
  SET_LED LED="Led_индикация" RED=0 GREEN=0.3804 BLUE=0 SYNC=0 TRANSMIT=1           # Включить зелёный свет о готовности
  SET_LED LED="Led_индикация" RED=0.1294 GREEN=0.1294 BLUE=0.1294 SYNC=0 TRANSMIT=1 # Включить фоновый свет

[gcode_macro Belt_tension]                                                          # Макрос для теста натяжки ремней
gcode:
  G28
  STOP_LED_EFFECTS EFFECT=progress_bar                                              # Деактивация эффектов ленты о проценте готовности печати
  SET_LED LED="Led_индикация" RED=0.3804 GREEN=0.2588 BLUE=0 SYNC=0 TRANSMIT=1      # Включить жёлтое свечение в серсисе
  COMPARE_BELTS_RESPONSES
  SET_LED LED="Led_индикация" RED=0 GREEN=0.3804 BLUE=0 SYNC=0 TRANSMIT=1           # Включить зелёный свет о готовности
  G4 P1000
  SET_LED LED="Led_индикация" RED=0.1294 GREEN=0.1294 BLUE=0.1294 SYNC=0 TRANSMIT=1 # Включить фоновый свет