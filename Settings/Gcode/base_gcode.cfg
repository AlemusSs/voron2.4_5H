#  G1 X92 Y355 F1000                                                             # Аккуратно почистить сопло
#  G1 X118 Y355 F1000                                                            # Аккуратно почистить сопло
#  G1 X92 Y355 F1000                                                             # Аккуратно почистить сопло
#  {% for wipe in range(5) %}                                                    # Начало зациклинности команд по чистке сопла
#    G1 X92 Y355 F20000                                                      
#    G1 X118 Y355 F20000                                                      
#  {% endfor %}                                                                  # Конец зацикленности команд выше
#  G1 X83 Y355 F20000                                                            # Отправить в место простоя
#  M104 S0                                                                       # Поставить нагрев экструдера на 0 и не ждать
#  M140 S0                                                                       # Поставить нагрев стола на 0 и не ждать
#  G1 X83 Y350 F20000                                                            # Отправить в место простоя
#  G1 X83 Y355 F20000                                                            # Отправить в место простоя
