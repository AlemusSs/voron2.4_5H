####################################################################################
# Базовые G-code, gcode.cfg
####################################################################################

[gcode_macro PRINT_START]                                                   # Стартовый Gcode принтера
variable_printing: False                                                    # Инициализировать переменную printing как False (флаг начала печати)
gcode:
 BED_MESH_PROFILE LOAD="default"                                            # Активация загруженной сетки стола
 SET_LED_EFFECT EFFECT=Static_RGB STOP=1                                    # Выключение статичного света для эффекта ниже
 SET_LED_EFFECT EFFECT=progress_bar                                         # Включение светового эффекта о прогрессе печати
 SET_DISPLAY_TEXT MSG="Старт предподготовки"                                # Отобразить статус на экране
 M117 Старт предподготовки
 SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=False         # Сбросить переменную printing в False
 INITIALIZE_TOOLCHANGER                                                     # Инициализировать toolchanger
 SET_DISPLAY_TEXT MSG="Домашняя позиция"                                    # Отобразить статус на экране
 M117 Домашняя позиция
 G28                                                                        # Домашняя позиция всех осей
 G1 X100 Y350 F20000                                                        # Почти место преднагрева
 G1 X100 Y355 F20000                                                        # Место преднагрева
 SET_DISPLAY_TEXT MSG="Первичный преднагрев стола"                          # Отобразить статус на экране
 M117 Первичный преднагрев стола
 M140 S{ params.BED_TEMP }                                                  # Начать нагрев стода до BED_TEMP и не ждать
 SET_DISPLAY_TEXT MSG="Первичный преднагрев экструдера"                     # Отобразить статус на экране
 M117 Первичный преднагрев экструдера
 M109 S150                                                                  # Нагреть активный экструдер до 150°C (смягчить остатки филамента для калибровки)
  {% for wipe in range(3) %}                                                # Чистка сопла
    G1 X110 Y355 F20000
    G1 X135 Y355 F20000
    G1 X135 Y353 F20000
    G1 X110 Y353 F20000
  {% endfor %}
 G1 X150 Y355 F20000                                                        # Место после чистки сопла
 SET_DISPLAY_TEXT MSG="Выравнивание портала"                                # Отобразить статус на экране
 M117 Выравнивание портала
 QUAD_GANTRY_LEVEL                                                          # Выравнивание портала
 M109 S0                                                                    # Остановить нагрев экструдера (0°C, так как может быть другой хотэнд)
 SET_DISPLAY_TEXT MSG="Смена ПГ для калибровки уровня Z"                    # Отобразить статус на экране
 M117 Смена ПГ для калибровки уровня Z
 T0                                                                         # Взятие первой (основной) печатной головы для калибровки
 G1 X100 Y350 F20000                                                        # Почти место преднагрева
 G1 X100 Y355 F20000                                                        # Место преднагрева
 SET_DISPLAY_TEXT MSG="Нагрев экструдера для калибровки уровня Z"           # Отобразить статус на экране
 M117 Нагрев экструдера для калибровки уровня Z
 M109 S150                                                                  # Нагреть активный экструдер до 150°C (смягчить остатки филамента для калибровки)
  {% for wipe in range(3) %}                                                # Чистка сопла
    G1 X110 Y355 F20000
    G1 X135 Y355 F20000
    G1 X135 Y353 F20000
    G1 X110 Y353 F20000
  {% endfor %}
 G1 X150 Y355 F20000                                                        # Место после чистки сопла
 SET_DISPLAY_TEXT MSG="Точная калибровки уровня Z"                          # Отобразить статус на экране
 M117 Точная калибровки уровня Z
 G28 Z                                                                      # Домашняя позиция по Z
 G1 Z10 F300                                                                # Приподнять текущую голову над столом
 SET_DISPLAY_TEXT MSG="Нагрев активных ПГ"                                  # Отобразить статус на экране
 M117 Нагрев активных ПГ
 G1 X100 Y350 F20000                                                        # Почти место преднагрева
 G1 X100 Y355 F20000                                                        # Место преднагрева
 M190 S{ params.BED_TEMP }                                                  # Начать нагрев стода до BED_TEMP и не ждать
  {% for tool_nr in printer.toolchanger.tool_numbers %}                     # Цикл: для каждого номера инструмента в toolchanger
    {% set tooltemp_param = 'T' ~ tool_nr|string ~ '_TEMP' %}               # Создать имя параметра, напр. T0_TEMP
    {% if tooltemp_param in params %}                                       # Проверка: если параметр T[NR]_TEMP передан
      M104 T{tool_nr} S{params[tooltemp_param]}                             # Установить нагрев для этого инструмента на T[NR]_TEMP (параллельный нагрев всех активных голов)
    {% endif %}
  {% endfor %}                                                              # Конец цикла по инструментам
 {% if params.TOOL is defined %}                                            # Проверка: если параметр TOOL передан
 SET_DISPLAY_TEXT MSG="Активация нужной ПГ"                                 # Отобразить статус на экране
 M117 Активация нужной ПГ
  T{params.TOOL}                                                            # Выбрать инструмент по номеру TOOL (T0, T1, T2, T3, T4)
 {% endif %}                                                                # Конец условия TOOL
 SET_DISPLAY_TEXT MSG="Нагрев активной ПГ"                                  # Отобразить статус на экране
 M117 Нагрев активной ПГ
 M109 S{ params.TOOL_TEMP }                                                 # Ждать нагрева выбранного экструдера до TOOL_TEMP
 #TEMPERATURE_WAIT SENSOR=extruder MINIMUM={ params.TOOL_TEMP|float * 0.95 } # Ждать достижения 95% от нагрева экструдера
 SET_DISPLAY_TEXT MSG="Начало печати"                                       # Отобразить статус на экране
 M117 Начало печати
 G1 X90 Y355 F20000                                                         # Отъехать на место продавливания пластика
 M106 S255                                                                  # Включить обдув модели
 G1 E10 F200                                                                # Выдавить пластик на 30мм
  {% for wipe in range(4) %}                                                # Чистка сопла
    G1 X110 Y355 F20000
    G1 X135 Y355 F20000
    G1 X135 Y353 F20000
    G1 X110 Y353 F20000
  {% endfor %}
 G1 X150 Y355 F20000                                                        # Место после чистки сопла
 M106 S0                                                                    # Выключить обдув модели
 initial_cleaning                                                           # Макрос выравнивания давления сопла
 G92 E0                                                                     # Обнулить позицию экструдера (E=0, начало экструзии)
 START_TOOL_PROBE_CRASH_DETECTION                                           # Запуск детекции столкновений инструментом
 SET_DISPLAY_TEXT MSG="Печать"                                              # Отобразить статус на экране
 M117 Печать

#--------------------------------------------------------------------

[gcode_macro PRINT_END]
gcode:
    STOP_TOOL_PROBE_CRASH_DETECTION                                        # Остановить детекцию столкновений с probe (если была активна; предотвращает ложные срабатывания после печати)
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=False     # Сбросить флаг printing в False (сигналит, что печать завершена; используется для паузы/стопа в других макросах)
    M400                                                                   # Ждать, пока буфер команд опустеет (завершить все предыдущие движения перед новыми)
    G92 E0                                                                 # Обнулить позицию экструдера (E=0; сбрасывает счётчик филамента для следующей печати)
    G1 E-4.0 F3600                                                         # Ретрагировать филамент на 4 мм на скорости 3600 мм/мин (оттяжка, чтобы предотвратить капание или стрингинг)
    G91                                                                    # Переключить в относительный режим позиционирования (движения X/Y/Z/E относительно текущей позиции, не абсолютные)
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}  # Jinja2: получить максимум X из секции [stepper_x] конфига (конвертировать в float; напр. 235 мм для вашего стола)
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}  # Jinja2: получить максимум Y из [stepper_y] (напр. 235 мм)
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}  # Jinja2: получить максимум Z из [stepper_z] (напр. 305 мм)
    # Комментарий: проверить текущую позицию для расчёта безопасного направления (чтобы не уйти за край стола)
    {% if printer.toolhead.position.x < (max_x - 20) %}                    # Jinja2-условие: если текущий X < max_X - 20 мм (есть запас слева)
        {% set x_safe = 20.0 %}                                            # Jinja2: установить безопасное перемещение X на +20 мм (вправо, от центра)
    {% else %}                                                             # Иначе (если уже у правого края)
        {% set x_safe = -20.0 %}                                           # Jinja2: установить X на -20 мм (влево, чтобы не упереться)
    {% endif %}                                                            # Конец условия для X
    {% if printer.toolhead.position.y < (max_y - 20) %}                    # Jinja2-условие: если текущий Y < max_Y - 20 мм (запас спереди)
        {% set y_safe = 20.0 %}                                            # Jinja2: установить Y на +20 мм (назад, от края)
    {% else %}                                                             # Иначе (у заднего края)
        {% set y_safe = -20.0 %}                                           # Jinja2: установить Y на -20 мм (вперёд)
    {% endif %}                                                            # Конец условия для Y
    {% if printer.toolhead.position.z < (max_z - 20) %}                    # Jinja2-условие: если текущий Z < max_Z - 20 мм (не у верхнего предела)
        {% set z_safe = 20.0 %}                                            # Jinja2: установить подъём Z на +20 мм (вверх для безопасности)
    {% else %}                                                             # Иначе (почти у максимума Z)
        {% set z_safe = max_z - printer.toolhead.position.z %}             # Jinja2: поднять до максимума Z (расчётный подъём до конца оси)
    {% endif %}                                                            # Конец условия для Z
    G0 X{x_safe} Y{y_safe} F20000                                          # Быстрое перемещение (G0) по X и Y на рассчитанные safe значения на скорости 20000 мм/мин (сдвиг для разрыва стринга, в безопасном направлении)
    G0 Z{z_safe} F3600                                                     # Быстрое перемещение Z вверх на safe значение на скорости 3600 мм/мин (подъём сопла для выключения нагрева)
    TURN_OFF_HEATERS                                                       # Выключить все нагреватели (экструдер и стол; безопасно после подъёма Z)
    M107                                                                   # Выключить вентилятор (part cooling fan; останавливает обдув)
    M140                                                                   # Выключить нагрев стола (M140 S0 подразумевается; асинхронно, без ожидания)
    G90                                                                    # Переключить обратно в абсолютный режим позиционирования (X/Y/Z от домашней позиции)
    {% set tool = printer[printer.toolchanger.tool] %}                     # Jinja2: получить объект текущего активного инструмента (toolchanger.tool — текущая T[n]; для доступа к его params)
    G0 X{tool.params_park_x} Y{tool.params_safe_y} Z300 F3600              # Перемещение (G0) в парковочную позицию: X из params_park_x инструмента, Y из params_safe_y, Z=300 мм (высокая парковка), скорость 3600 мм/мин
    M18                                                                    # Отключить моторы (disable steppers; экономит энергию, позволяет вручную двигать оси)
    M117 Печать завершена

#[gcode_macro PRINT_END]                                                         # Завершение печати, завершающий G-code
