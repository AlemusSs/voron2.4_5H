#  SET_FAN_SPEED FAN=Подогрев_камеры SPEED=0                                     # Отключить обдув камеры
#  M84                                                                           # Отключить двигатели
#  STOP_LED_EFFECTS EFFECT=progress_bar                                          # Деактивация эффектов ленты о проценте готовности печати
#  SET_LED LED="Led_индикация" RED=0 GREEN=0.3804 BLUE=0 SYNC=0 TRANSMIT=1       # Включить зелёный свет о готовности
#  G4 P1200                                                                      # Подождать 1000 милисекунд (120 секунд)
#  SET_LED_EFFECT EFFECT=Static_RGB                                              # Активация центра подсветки
  
