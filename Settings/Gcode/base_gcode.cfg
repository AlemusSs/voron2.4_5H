[gcode_macro LOAD_FILAMENT]
description: Загрузка пластика для текущей головы
variable_ignore_min_extrude_temp: True                                                          # Игнорировать минимальную температуру экструзии для этого макроса
gcode:
  M117 Загрузка
  M104 S240                                                                                     # Установить температуру экструдера на 240°C (начать нагрев)
  G90                                                                                           # Переключить в абсолютный режим позиционирования (X/Y/Z)
  G1 X100 Y20 Z20 F1800                                                                         # Переместить головку в позицию X=100, Y=20, Z=20 на скорости 1800 мм/мин (центр стола для загрузки)
  M104 S240                                                                                     # Установить температуру экструдера на 240°C (повтор для уверенности)
  TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM=240                               # Ждать, пока экструдер нагреется до минимум 240°C
  M83                                                                                           # Переключить экструдер в относительный режим (движения E относительно текущей позиции)
  G1 E50 F300                                                                                   # Экструдировать 50 мм филамента на скорости 300 мм/мин (первая часть загрузки)
  G1 E50 F300                                                                                   # Экструдировать ещё 50 мм на той же скорости (общая экструзия 100 мм для полной подачи филамента)
  G1 E-4 F1800                                                                                  # Ретрагировать 4 мм на скорости 1800 мм/мин (небольшая оттяжка, чтобы филамент не капал из сопла)
  M82                                                                                           # Переключить экструдер в абсолютный режим (движения E от нуля)
  M400                                                                                          # Ждать, пока буфер команд опустеет (завершить все движения)
  M104 S0                                                                                       # Остановить нагрев экструдера (установить 0°C)
  M117 Загрузка завершена

#[gcode_macro Load_FILAMENT]               # Загрузка пластика
#gcode:
#  STOP_LED_EFFECTS EFFECT=progress_bar                                          # Деактивация эффектов ленты о проценте готовности печати
#  STOP_LED_EFFECTS EFFECT=Static_RGB                                            # Деактивация эффектов ленты статическом свете в центре
# SET_LED LED="Led_индикация" RED=0.3804 GREEN=0.2588 BLUE=0 SYNC=0 TRANSMIT=1  # Включить жёлтое свечение в серсисе
