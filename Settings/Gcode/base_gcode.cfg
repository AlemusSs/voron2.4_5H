[gcode_macro PAUSE]
description: Приостановка текущей печати
rename_existing: PAUSE_BASE  # Раскомментируйте, если нужно переименовать базовый PAUSE
gcode:
  STOP_LED_EFFECTS EFFECT=progress_bar                                           # Деактивация эффектов ленты о проценте готовности печати
  SET_LED LED="Led_индикация" RED=0.3804 GREEN=0.2588 BLUE=0 SYNC=0 TRANSMIT=1   # Включение жёлтого света о сервисе
  SAVE_GCODE_STATE NAME=PAUSE                                                    # Сохранить текущее состояние G-code (позиция, режимы и т.д.)
  PAUSE_BASE                                                                     # Приостановить печать (важно: раньше парковки!)
  {% set current_extruder = printer.toolhead.extruder %}
  {% if printer[current_extruder].can_extrude %}                                 # Проверяем, можно ли экструдировать (экструдер нагрет)
    G91                                                                          # Относительный режим
    G1 E-3 F1800                                                                 # Ретрагировать 3 мм на 1800 мм/мин (настройте под свой филамент)
    G90                                                                          # Абсолютный режим
  {% endif %}
  G91                                                                            # Относительный режим
  G1 Z5 F900                                                                     # Поднять Z на 5 мм
  G90                                                                            # Абсолютный режим
  G1 X100 Y350 F20000
  G1 X100 Y355 F20000
  {% for wipe in range(2) %}
    G1 X110 Y355 F20000
    G1 X135 Y355 F20000
    G1 X135 Y353 F20000
    G1 X110 Y353 F20000
  {% endfor %}
  G1 X100 Y355 F20000
  
  # Опционально: отключить нагрев (если пауза долгая)
  # M104 S0  # Раскомментируйте, если хотите выключить экструдер

#--------------------------------------------------------------------

[gcode_macro RESUME]                                                           # Возобновление печати
description: Возобновление текущей печати
#rename_existing: RESUME_BASE
gcode:
  SET_LED LED="Led_индикация" RED=0.3804 GREEN=0.2588 BLUE=0 SYNC=0 TRANSMIT=1
  G1 X90 Y355 F20000                                                           # Отправить в место простоя
  G1 E30 F200                                                                  # Выдавить пластик на 25мм
  G90                                                                          # Установите абсолютное позиционирование
  {% for wipe in range(5) %}                                                   # Начало зациклинности команд по чистке сопла
    G1 X110 Y355 F20000
    G1 X135 Y355 F20000
    G1 X135 Y353 F20000
    G1 X110 Y353 F20000                                                      
  {% endfor %}
  G1 X150 Y355 F20000                                                          # Место после чистки сопла
  G90                                                                          # Установите абсолютное позиционирование
  SET_LED_EFFECT EFFECT=progress_bar                                           # Обратное включение эффектов ленты о проценте готовности печати
  RESUME_BASE {get_params}                                                     # окончание выполнения возобновления

