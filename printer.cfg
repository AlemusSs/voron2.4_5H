
# Вся основная информация и параметры о принтере, printer.cfg

[include mainsail.cfg]                              # Взять параметры ещё и от туда
[include Settings/mainsail-config/mainsail-dop.cfg] # Взять параметры ещё и от туда
[include timelapse.cfg]                             # Взять параметры ещё и от туда
[include Settings/Gcode/base_gcode.cfg]             # Взять параметры ещё и от туда
[include Settings/Gcode/homing.cfg]                 # Взять параметры ещё и от туда
[include Settings/Gcode/macros.cfg]                 # Взять параметры ещё и от туда
[include Settings/Gcode/tool_detection.cfg]         # Взять параметры ещё и от туда
[include Settings/Gcode/toolchanger.cfg]            # Взять параметры ещё и от туда
[include Settings/Head/print_head_1.cfg]            # Параметры 1-й печатной головы
[include Settings/Head/print_head_2.cfg]            # Параметры 2-й печатной головы
[include Settings/Head/print_head_3.cfg]            # Параметры 3-й печатной головы
[include Settings/Head/print_head_4.cfg]            # Параметры 4-й печатной головы
[include Settings/Head/print_head_5.cfg]            # Параметры 5-й печатной головы


#####################################################################
# Модель принтера и ограничения
#####################################################################

[printer]
kinematics: corexy                        # Тип принтера: corexy.
max_velocity: 1000                        # Максимальная скорость (max. 1000 mm/s).
max_accel: 7590                           # Максимальное ускорение (max. 6200 mm/s²).
max_z_velocity: 150                       # Максимальная скорость по оси Z (40 mm/s).
max_z_accel: 500                          # Максимальное ускорение по оси Z (350 mm/s²).
square_corner_velocity: 5                 # Квадратная угловая скорость (5.0 mm/s).

#####################################################################
# MCU Octopus - материнская плата
#####################################################################

[mcu]
#serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_540045000451313031393839-if00 # Если плата подключена по UBS в обычном режиме
canbus_uuid: 51f4ad595709                 # Уникальный идентификатор шины CAN для микроконтроллера Octopus.
canbus_interface: can0                    # Интерфейс шины CAN.

#####################################################################
# Мониторинг температуры (актуально в KlipperScreen) - кроме печатых голов
#####################################################################

[temperature_sensor Камера]               # Название
sensor_pin: PF4                           # Пин подключения термитсора
sensor_type: ATC Semitec 104GT-2	      # Тип подключённого термистора - ATC Semitec 104GT-2

[temperature_sensor Материнка]            # Название, BTT-MCU
sensor_type: temperature_mcu              # Внутренний датчик температуры процессора на материнке.

[temperature_sensor BTT_PI]               # Название
sensor_type: temperature_host             # Внутренний датчик температуры хосте.

#####################################################################
# Расположение моторов портала
#
#                        B(X) ---------A(Y)
#                        |                |
#                        |                |
#                        |--------E-------|
#                        |                |
#                        |                |
#                        |                |
#
#####################################################################
# Двигатель X MOTOR_0(B Motor)
#####################################################################

[stepper_x]
step_pin: PF13                           # Настройка импульсного пина двигателя по оси X
dir_pin: PF12                            # Настройка пина направления двигателя по оси X
enable_pin: !PF14                        # Двигатель по оси X позволяет установить пин
microsteps: 32                           # Настройка микрошагов двигателя
rotation_distance: 40                    # Диаметр активного шкива в мм (шкив 2GT-20T — 40 мм, шкив 2GT-16T — 32 мм)
full_steps_per_rotation: 200             # Количество импульсов, необходимых для одного оборота двигателя (двигатель 1,8 градуса: 200, двигатель 0,9 градуса: 400)
endstop_pin: PG6                         # Настройка контактов концевого выключателя (X-)
position_min: 0                          # Минимальное перемещение по оси X — ограничение программного обеспечения
position_endstop: 351                    # Механические координаты точки сброса для оси X (351мм, самый правый угол)
position_max: 351                        # Максимальное перемещение по оси X — ограничение программного обеспечения (351мм)
homing_speed: 100                        # Скорость концевой парковки
homing_retract_dist: 5                   # Расстояние, на которое голова откатывается после первого срабатывания переключателя сброса
homing_positive_dir: true                # Направление сброса (обычно не требует изменений)
homing_retract_speed: 50                 # Скорость отката

[tmc2240 stepper_x]
cs_pin: PC4                              # Контакт выбора микросхемы для драйвера TMC2240
spi_software_sclk_pin: PA5               # PIN-код часов программного обеспечения SPI
spi_software_mosi_pin: PA7               # Пин-код MOSI программного обеспечения SPI
spi_software_miso_pin: PA6               # Программное обеспечение SPI MISO pin-код
driver_TPFD: 0                           # Настройка TMC2240 TPFD
run_current: 1.0                         # Значение рабочего тока двигателя (А) (было 1.2)
interpolate: true

#####################################################################
# Двигатель Y MOTOR_1（A Motor）
#####################################################################

[stepper_y]
step_pin: PG0                            # Настройка импульсного пина двигателя по оси Y
dir_pin: PG1                             # Настройка импульсного пина двигателя по оси Y
enable_pin: !PF15                        # Двигатель по оси Y позволяет установить пин
microsteps: 32                           # Настройка микрошагов двигателя
rotation_distance: 40                    # Диаметр активного шкива в мм (шкив 2GT-20T — 40 мм, шкив 2GT-16T — 32 мм)
full_steps_per_rotation: 200             # Количество импульсов, необходимых для одного оборота двигателя (двигатель 1,8 градуса: 200, двигатель 0,9 градуса: 400)
endstop_pin: PG9                         # Настройка контактов концевого выключателя (Y-)
position_min: 0                          # Минимальное перемещение по оси Y — ограничение программного обеспечения
position_endstop: 355                    # Механические координаты точки сброса для оси Y (355мм, самый правый угол)
position_max: 355                        # Максимальное перемещение апо оси Y — ограничение программного обеспечения (355мм)
homing_speed: 100                        # Скорость концевой парковки
homing_retract_dist: 5                   # Расстояние, на которое голова откатывается после первого срабатывания переключателя сброса
homing_positive_dir: true                # Направление сброса (обычно не требует изменений)
homing_retract_speed: 50                 # Скорость отката

[tmc2240 stepper_y]
cs_pin: PD11                             # Контакт выбора микросхемы для драйвера TMC2240
spi_software_sclk_pin: PA5               # PIN-код часов программного обеспечения SPI
spi_software_mosi_pin: PA7               # Пин-код MOSI программного обеспечения SPI
spi_software_miso_pin: PA6               # Программное обеспечение SPI MISO pin-код
driver_TPFD: 0                           # Настройка TMC2240 TPFD
run_current: 1.0                         # Значение рабочего тока двигателя (А) (было 1.2)
interpolate: true

#####################################################################
#                          z1 ------------- z2
#                          |                 |
#                          |                 |
#                          |                 |
#                          |                 |
#                          |                 |
#                          |                 |
#                          z0 -- дисплей -- z3
#####################################################################
# Двигатель Z0 MOTOR_2 (левый ближний)
#####################################################################

[stepper_z]
step_pin: PF11    		                 # Пин импульса двигателя по оси Z
dir_pin: PG3                             # Настройка пина направления двигателя по оси Z (инвертируется добавлением ! перед пином)
enable_pin: !PG5                         # Двигатель по оси Z позволяет установить пин
rotation_distance: 40                    # Диаметр активного шкива, мм (шкив 2GT-20T — 40, шкив 2GT-16T — 32)
gear_ratio: 80:16                        # Коэффициент уменьшения
microsteps: 32                           # Микрошаг двигателя
endstop_pin: probe:z_virtual_endstop     #PG10,  Интерфейс концевого выключателя.
                                         # position_endstop — это расстояние от поверхности печати до точки срабатывания ограничителя Z.
                                         # Positive value = над конечной точкой платформы，
                                         # Negative value = конечная точка ниже плато.
                                         # Увеличение значения position_endstop приблизит сопло к рабочей поверхности.
                                         # После запуска Z_ENDSTOP_CALIBRATE значение position_endstop будет сохранено в конце конфигурации CFG.
# position_endstop: 0.5                  # Изменено в соответствии с фактическим
position_max: 350                        # Максимальная высота печати по оси Z 310мм
position_min: -5                         # Плавный предел минимального хода
homing_speed: 30                         # Скорость опускания портала
second_homing_speed: 3                   # Скорость вторичного сброса (базово 3)
homing_retract_dist: 0                   # Расстояние отступления

#--------------------------------------------------------------------

[tmc2209 stepper_z]                     # Драйвер TMC2209
uart_pin: PC6                           # Коммуникационный порт драйвера по UART
interpolate: true                       # Следует ли включить 256-ступенчатую интерполяцию (да\нет)
run_current: 0.8                        # Значение рабочего тока двигателя (мА)
hold_current: 0.8                       # Ток удержания (мА)
sense_resistor: 0.110                   # Значение резистора
stealthchop_threshold: 0                # Порог отключения звука, 200

#####################################################################
# Двигатель Z1 MOTOR_3 (левый задний)
#####################################################################

[stepper_z1]
step_pin: PG4                            # Пин импульса двигателя по оси Z
dir_pin: !PC1                            # Настройка пина направления двигателя по оси Z (инвертируется добавлением ! перед пином)
enable_pin: !PA0                         # Двигатель по оси Z позволяет установить пин
rotation_distance: 40                    # Диаметр активного шкива, мм (шкив 2GT-20T — 40, шкив 2GT-16T — 32)
gear_ratio: 80:16                        # Коэффициент уменьшения
microsteps: 32                           # Микрошаг двигателя

#--------------------------------------------------------------------

[tmc2209 stepper_z1]                     # Драйвер TMC2209
uart_pin: PC7                            # Коммуникационный порт драйвера по UART
interpolate: true                        # Следует ли включить 256-ступенчатую интерполяцию (да\нет)
run_current: 0.8                         # Значение рабочего тока двигателя (мА)
hold_current: 0.8                        # Ток удержания (мА)
sense_resistor: 0.110                    # Значение резистора
stealthchop_threshold: 0                 # Порог отключения звука

#####################################################################
# Двигатель Z2 MOTOR_4 (правый задний)
#####################################################################

[stepper_z2]
step_pin: PF9                            # Пин импульса двигателя по оси Z
dir_pin: PF10                            # Настройка пина направления двигателя по оси Z (инвертируется добавлением ! перед пином)
enable_pin: !PG2                         # Двигатель по оси Z позволяет установить пин
rotation_distance: 40                    # Диаметр активного шкива, мм (шкив 2GT-20T — 40, шкив 2GT-16T — 32)
gear_ratio: 80:16                        # Коэффициент уменьшения
microsteps: 32                           # Микрошаг двигателя

#--------------------------------------------------------------------

[tmc2209 stepper_z2]                     # Драйвер TMC2209
uart_pin: PF2                            # Коммуникационный порт драйвера по UART
interpolate: true                        # Следует ли включить 256-ступенчатую интерполяцию (да\нет)
run_current: 0.8                         # Значение рабочего тока двигателя (мА)
hold_current: 0.8                        # Ток удержания (мА)
sense_resistor: 0.110                    # Значение резистора
stealthchop_threshold: 0                 # Порог отключения звука

#####################################################################
# Двигатель Z2 MOTOR_4 (правый передний)
#####################################################################

[stepper_z3]
step_pin: PC13                           # Пин импульса двигателя по оси Z
dir_pin: !PF0                            # Настройка пина направления двигателя по оси Z (инвертируется добавлением ! перед пином)
enable_pin: !PF1                         # Двигатель по оси Z позволяет установить пин
rotation_distance: 40                    # Диаметр активного шкива, мм (шкив 2GT-20T — 40, шкив 2GT-16T — 32)
gear_ratio: 80:16                        # Коэффициент уменьшения
microsteps: 32                           # Микрошаг двигателя

#--------------------------------------------------------------------

[tmc2209 stepper_z3]                     # Драйвер TMC2209
uart_pin: PE4                            # Коммуникационный порт драйвера по UART
interpolate: true                        # Следует ли включить 256-ступенчатую интерполяцию (да\нет)
run_current: 0.8                         # Значение рабочего тока двигателя (мА)
hold_current: 0.8                        # Ток удержания (мА)
sense_resistor: 0.110                    # Значение резистора
stealthchop_threshold: 0                 # Порог отключения звука

#####################################################################
# Нагрев стола
#####################################################################

[heater_bed]
heater_pin: PA3                          # Выход нагревателя
sensor_pin: PF3                          # Пин датчика температура
sensor_type: ATC Semitec 104GT-2	     # Тип термистора - ATC Semitec 104GT-2
min_temp: 0                              # Минимальный температурный порог
max_temp: 120                            # Максимальный температурный порог
max_power: 1.0                           # Максимальная мощность обогревателя или вентилятора

#####################################################################
# Вентиляторы дополнительные
#####################################################################

#[heater_fan Продувка_в_подвале]          # Продувка в подвале
#pin: PE5                                 # Пин вентилятора
#shutdown_speed: 0.0                      # Скорость, при которой вентилятор отключается
#kick_start_time: 0.5                     # Время запуска вентилятора
#heater: extruder                         # Нагреватель, связанный с этим вентилятором - сейчас со нагревателем сопла
#heater_temp: 150                         # Температура, при которой включается вентилятор
#fan_speed: 0.6                           # Скорость вращения вентилятора

#[heater_fan "название"]                  # Свободный управляемый вход вентилятора
#pin: PD12                                # Пин вентилятора
#shutdown_speed: 0.0                      # Скорость, при которой вентилятор отключается
#ick_start_time: 0.5                      # Время запуска вентилятора
#heater: extruder                         # Нагреватель, связанный с этим вентилятором - сейчас со нагревателем сопла
#eater_temp: 150                          # Температура, при которой включается вентилятор
#fan_speed: 0.6                           # Скорость вращения вентилятора

#--------------------------------------------------------------------

[fan_generic Вытяжка]                    # Вытяжной вентилятор Exhaust
pin: PD13                                # Пин вентилятора
max_power: 1.0                           # Максимальная мощность
kick_start_time: 0.5                     # Время запуска вентилятора
cycle_time: 0.00003                      # Время цикла
#--------------------------------------------------------------------

[fan_generic Подогрев_камеры]            # Обдув из под стола
pin: PA8                                 # Пин вентилятора
max_power: 1.0                           # Максимальная мощность
kick_start_time: 0.5                     # Время запуска вентилятора
cycle_time: 0.00003                      # Время цикла

#####################################################################
# Настройки RGB светодиодной ленты
#####################################################################

[neopixel Led_индикация]                 # Подсветка сзади портала
pin: PB0                                 # Пины для управления LED light control
chain_count: 36                          # Количество светодиодов в цепочке
color_order: GRB                         # Порядок выбора цвета для светодиодов
initial_RED: 0                           # Начальная базовая красная яркость (0.0118)
initial_GREEN: 0                         # Начальная базовая яркость зеленого цвета (0.0118)
initial_BLUE: 0                          # Начальная базовая яркость синего цвета (0.0118)

[output_pin Подсветка_корпуса]
pin: PD14                                # Пин, на который она подключена
value: 1                                 # 1 = включено при старте
shutdown_value: 0                        # Выключить при аварии

####################################################################################
# Варианты использования задней LED ленты
####################################################################################

[led_effect progress_bar]                        # Отображение процента выполнения печати
leds:
  neopixel:Led_индикация (3-35)
autostart: false                                 # Автостарт включён или нет (true - да, false - нет)
frame_rate: 24                                   # Кол-во кадров в секунду
layers:
  progress -1 0 add (0, 0, 1), (0, 0.1, 0.6)     # Синий градиент по мере выполнения
  static 0 0 top (0.0118, 0.0118, 0.0118)        # Фоновый цвет
  
[led_effect critical_error]                      # Загорится красным, если будет критическая ошибка
leds:
  neopixel:Led_индикация
layers:
  breathing 2 0 difference (0.95, 0.0, 0.0)
autostart: false                                 # втостарт включён или нет (true - да, false - нет)
frame_rate: 24                                   # Кол-во кадров в секунду
run_on_error: true

[led_effect Light_from_the_table]                # Отображение нагрева стола (правая сторона)
leds:
  neopixel:Led_индикация (36)
autostart: true
frame_rate: 24
heater: heater_bed
layers:
  heater 40 0 add (1,1,0),(1,0,0)                # Красный, зелёный, синий

[led_effect Light_from_the_head]                 # Отображение нагрева экструдера (левая сторона)
leds:
 neopixel:Led_индикация (1,2)
autostart: true                                  # втостарт включён или нет (true - да, false - нет)
frame_rate: 24                                   # Кол-во кадров в секунду
heater: extruder
layers:
  heater 40 0 add (1,1,0),(1,0,0)                # Красный, зелёный, синий

[led_effect Static_RGB]                          # Отображение статического белого цвета в центре
leds:
  neopixel:Led_индикация (3-35)
autostart: true                                  # втостарт включён или нет (true - да, false - нет)
frame_rate: 24                                   # Кол-во кадров в секунду
layers:
  static 1 0 top (0.2, 0.2, 0.2)                 # Красный, зелёный, синий

####################################################################################
# Настройки выравнивания портала и карты стола
####################################################################################

[quad_gantry_level]
gantry_corners:                          # Координаты для углов портала
	-60,-10
	410,420
points:                                  # 1-левый ближний, 2-правый дальний, 3-ближний правый, 4- ближний левый | X,Y
	10,20
	10,340
	340,340
	340,20
speed: 500                               # Скорость перемещения при сканировании мм/с
horizontal_move_z: 5                     # Высота по оси Z для горизонтальных перемещений
retries: 5                               # Количество повторных попыток при выходе за пределы допустимого значения
retry_tolerance: 0.01                    # Допуск к повторной попытке
max_adjust: 5                            # Максимальный ход регулировки для выравнивания

[bed_mesh]
zero_reference_position: 175,175          # Центр стола. Этот вариант подходит для модели 350.
speed: 200                                # Скорость перемещения печатной головы во время сканирования сетки
horizontal_move_z: 5                      # Высота сканера при сканировании сетки стола
mesh_min: 30, 30                          # Начальная точка сетки [X, Y]
mesh_max: 320, 320                        # Конечная точка сетки [X, Y]
probe_count: 10, 10                       # Количество точек probing (10 по X, 10 по Y; итого 100 точек для сетки)
algorithm: bicubic                        # Тип сканирования
adaptive_margin: 10

#####################################################################
# Действия при включении принтера
#####################################################################

[delayed_gcode INIT_ON_RESTART]
initial_duration: 0.01
gcode:
    INIT_TOOL_HEADS

#[delayed_gcode startup_led]
#initial_duration: 3.0                   # Задержка 3 сек после инициализации
#gcode:

#####################################################################
# Дополнительные коды
#####################################################################

[idle_timeout]
timeout: 172800                          # Время в секундах (2 дня, 172800 секунд) до выключения нагрева стола, если принтер простаивает

[exclude_object]                         # Исключение объектов

#[save_variables]
#filename: ~/printer_data/config/variables.cfg

#[shaketune]
# result_folder: ~/printer_data/config/ShakeTune_results              # Путь, по которому будут сохраняться обработанные результаты. Если папка не существует, он будет создан автоматически. 
                                                                      # Вы можете изменить это, если хотите сохранить в другом месте.
                                                                      # Этот параметр определяет, сколько результатов вы хотите сохранить в папке с результатами.
                                                                      # Как только будет превышено указанное количество, старые результаты будут автоматически удалены чтобы освободить место 
                                                                      # на SD-карте и не загромождать папку с результатами.
                                                                      
# keep_raw_data: False                                                # Если установлено значение True, Shake&Tune сохранит как обработанные графики, так и исходные данные акселерометра
                                                                      # Файлы данных .st в папке результатов. Это может быть полезно для отладки или архивирования.
                                                                      # Пожалуйста, всегда прикрепляйте их, сообщая о любых проблемах на GitHub или Discord.
                                                                      
# show_macros_in_webui: True                                          # В Mainsail и Fluid не создаются кнопки для системных команд (макросов, которые не являются частью
                                                                      # файла printer.cfg). Эта опция позволяет Shake&Tune внедрять их в веб-интерфейс во время выполнения.
                                                                      # Если установлено значение False, макросы будут скрыты, но по-прежнему доступны из консоли при вводе
                                                                      # их имена вручную, что может быть полезно, если вы предпочитаете инкапсулировать их в свои собственные макросы.
                                                                      
# timeout: 600                                                        # Это определяет максимальное время обработки (в секундах), которое позволяет использовать Shake&Tune для создания 
                                                                      # графиков из файла данных .set. В большинстве случаев 10 минут должно быть более чем достаточно, но если у вас есть
                                                                      # если оборудование работает медленнее (например, старые SD-карты или устройства с низкой производительностью), увеличьте его, чтобы предотвратить тайм-ауты.
                                                                      
# measurements_chunk_size: 2                                          # Каждая команда Shake&Tune использует акселерометр для выполнения нескольких измерений. По умолчанию,
                                                                      # Shake&Tune будет записывать на диск фрагмент данных каждые два измерения, а в конце
                                                                      # команда объединит эти фрагменты в окончательный файл данных .st для обработки. "2" - это очень
                                                                      # консервативная настройка, позволяющая избежать ошибок слишком близкого таймера Klipper на устройствах младшего уровня с небольшим объемом
                                                                      # оперативной памяти, и она должна работать для всех. Однако, если вы используете мощный компьютер, вы можете
                                                                      # увеличить это значение, чтобы сохранить в памяти больше измерений (например, 15-20) перед записью
                                                                      # разделите файл на части и избегайте чрезмерной нагрузки на файловую систему.
                                                                      
# max_freq: 200                                                       # Эта настройка определяет максимальную частоту, при которой отключается расчет спектральной плотности мощности.
                                                                      # Значение по умолчанию должно подходить для большинства устройств и комбинаций акселерометров.
                                                                      # Не прикасайтесь к нему, если не знаете, что делаете.
                                                                      
# dpi: 300                                                            # Управляет разрешением создаваемых графиков. Значение по умолчанию, равное 300 dpi, было оптимизировано
                                                                      # и обеспечивает баланс между производительностью и удобочитаемостью, обеспечивая четкость графиков
                                                                      # без использования слишком большого объема оперативной памяти для их создания. Обычно вам не нужно изменять это значение.

